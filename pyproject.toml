[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doom-nwm-p0"
version = "0.1.0"
description = "Inference-only action-conditioned Doom world model and optional FlyByWire steering"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "opencv-python>=4.8",
    "safetensors>=0.4",
    "huggingface_hub>=0.23",
    "pyarrow>=15",
]

[tool.setuptools]
packages = ["dit", "flybywire"]
